<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal Budget Management Dashboard - Track expenses, analyze spending trends, manage budget limits, and achieve financial clarity." />
    <meta name="theme-color" content="#2563eb" />
    <title>Budget Management - Financial Overview</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && userPrefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
